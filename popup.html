<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Price Lantern</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <div class="brand"><span class="brand-mark">p</span> price lantern<span class="brand-dot">.</span></div>
    <h1>A little patience<br />pays off.</h1>
    <p>Keep an eye on something you love.</p>
    <p class="popup-privacy">
      This page’s product title and price are read when you choose Track or Pick. Saved watches stay
      in this browser; price checks contact the shop.
      <a href="https://github.com/msmece/still-price-tracker/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">Privacy policy</a>
    </p>
    <button id="track" class="primary">Track this page <span>↗</span></button
    ><button id="pick" class="secondary">Pick a price on the page</button>
    <p id="popup-status" role="status"></p>
    <button id="dashboard" class="text-button">Open your watchlist →</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
